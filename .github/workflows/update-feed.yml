name: Update live news feed

on:
  schedule:
    - cron: "*/30 * * * *"     # every 30 minutes (GitHub may delay runs by a few minutes)
  workflow_dispatch:            # adds the "Run workflow" button

permissions:
  contents: write

concurrency:
  group: update-feed
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch live items
        run: python scripts/feed_fetcher.py
      - name: Commit only if the feed changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add data/signals.json
          if git diff --cached --quiet; then
            echo "No new items - nothing to commit."
            exit 0
          fi
          git commit -m "Live feed update $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          git commit -m "Live feed update $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
