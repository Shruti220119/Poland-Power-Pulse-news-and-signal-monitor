name: Update live news feed

on:
  schedule:
    - cron: "*/30 * * * *"        # every 30 minutes (GitHub may start scheduled runs a few minutes late)
  workflow_dispatch:              # "Run workflow" button for a manual check

permissions:
  contents: write

concurrency:
  group: update-feed
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6          # Node 24 (was v4 / Node 20)

      - uses: actions/setup-python@v6      # Node 24 (was v5 / Node 20)
        with:
          python-version: "3.11"

      - name: Fetch sources (existing + additional)
        env:
          AZURE_TRANSLATOR_KEY: ${{ secrets.AZURE_TRANSLATOR_KEY }}
          AZURE_TRANSLATOR_REGION: ${{ secrets.AZURE_TRANSLATOR_REGION }}
        run: python scripts/feed_fetcher.py

      - name: Enrich new items from the original articles
        run: python scripts/enrich_signals.py

      - name: Show run summary
        run: |
          python - <<'PY'
          import json
          s = json.load(open("data/feed_status.json"))
          a = s.get("additional_sources", {})
          print("Run finished:", s.get("run_finished_utc"))
          print("Websites OK:", s.get("websites_ok"), "/", s.get("websites_read_directly"))
          print("Additional sources checked:", a.get("checked_this_run"), "/", a.get("live_sources"),
                "· read OK:", a.get("with_at_least_one_ok_read"))
          print("New items this run:", s.get("new_items_this_run"), "· items in feed:", s.get("items_in_feed"))
          PY

      - name: Commit updated data
        run: |
          git config user.name  "ppp-bot"
          git config user.email "ppp-bot@users.noreply.github.com"
          git add data/signals.json data/feed_status.json data/site_watch.json
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Live feed update $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase --autostash
          git push
