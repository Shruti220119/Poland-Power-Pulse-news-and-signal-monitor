name: Update live news feed

on:
  schedule:
    - cron: "*/30 * * * *"          # every 30 minutes (GitHub may start scheduled runs a few minutes late)
  workflow_dispatch:                # "Run workflow" button for a manual check
  push:                             # run straight away when the scripts or source list change
    branches: [main]
    paths:
      - "scripts/**"
      - "config/additional_feed_sources.json"
      - ".github/workflows/update-feed.yml"

permissions:
  contents: write

concurrency:
  group: update-feed
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5          # Node 24
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v6      # Node 24
        with:
          python-version: "3.11"

      - name: Check repository layout
        run: |
          missing=0
          for f in scripts/feed_fetcher.py scripts/enrich_signals.py config/additional_feed_sources.json index.html; do
            if [ ! -f "$f" ]; then echo "::error::Missing $f — upload it to this exact folder"; missing=1; fi
          done
          mkdir -p data
          exit $missing

      - name: Fetch sources (existing + additional)
        env:
          AZURE_TRANSLATOR_KEY: ${{ secrets.AZURE_TRANSLATOR_KEY }}
          AZURE_TRANSLATOR_REGION: ${{ secrets.AZURE_TRANSLATOR_REGION }}
        run: python scripts/feed_fetcher.py

      - name: Enrich new items from the original articles
        continue-on-error: true              # a failed article read must not block publishing the feed
        run: python scripts/enrich_signals.py

      - name: Show run summary
        if: always()
        continue-on-error: true
        run: |
          python - <<'PY'
          import json, os
          if not os.path.exists("data/feed_status.json"):
              print("::warning::data/feed_status.json was not written - see the 'Fetch sources' step log"); raise SystemExit
          s = json.load(open("data/feed_status.json"))
          a = s.get("additional_sources", {})
          sig = json.load(open("data/signals.json"))
          print("Run finished:", s.get("run_finished_utc"))
          print("Translation:", s.get("translation"))
          print("Websites OK:", s.get("websites_ok"), "/", s.get("websites_read_directly"))
          print("Additional sources checked:", a.get("checked_this_run"), "/", a.get("live_sources"),
                "· read OK:", a.get("with_at_least_one_ok_read"))
          print("New items this run:", s.get("new_items_this_run"), "· items in feed:", len(sig.get("signals", [])))
          print("Polish items waiting for translation (hidden on the dashboard):", s.get("polish_items_waiting_for_translation"))
          PY

      - name: Commit updated data
        if: always()
        run: |
          git config user.name  "ppp-bot"
          git config user.email "ppp-bot@users.noreply.github.com"
          git add data/signals.json data/feed_status.json data/site_watch.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Live feed update $(date -u +'%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push origin HEAD:main && exit 0
            echo "Push failed (attempt $i) - retrying"; sleep 10
          done
          echo "::error::Could not push the feed update. Check Settings → Actions → General → Workflow permissions = Read and write."
          exit 1
