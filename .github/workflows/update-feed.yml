name: Update live news feed

on:
  schedule:
    - cron: "*/30 * * * *"     # every 30 minutes
  workflow_dispatch:            # "Run workflow" button

permissions:
  contents: write

concurrency:
  group: update-feed
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Check repository files
        run: |
          if [ ! -f scripts/feed_fetcher.py ]; then
            echo "::error::scripts/feed_fetcher.py is missing. Upload it into a folder named 'scripts' at the repo root."
            exit 1
          fi
          if [ ! -f scripts/enrich_signals.py ]; then
            echo "::warning::scripts/enrich_signals.py is missing - items will show the RSS teaser instead of the article text, capacity and delay. Upload it into 'scripts'."
          fi
          mkdir -p data
          [ -f data/signals.json ] || echo '{"updated": null, "signals": []}' > data/signals.json

      - name: Fetch live items
        run: python scripts/feed_fetcher.py
        env:
          AZURE_TRANSLATOR_KEY: ${{ secrets.AZURE_TRANSLATOR_KEY }}
          AZURE_TRANSLATOR_REGION: ${{ secrets.AZURE_TRANSLATOR_REGION }}

      - name: Read original articles (capacity, delay, what changed)
        if: hashFiles('scripts/enrich_signals.py') != ''
        run: python scripts/enrich_signals.py
        continue-on-error: true        # a problem here must never stop the feed from being saved
        env:
          AZURE_TRANSLATOR_KEY: ${{ secrets.AZURE_TRANSLATOR_KEY }}
          AZURE_TRANSLATOR_REGION: ${{ secrets.AZURE_TRANSLATOR_REGION }}

      - name: Save feed to repository
        run: |
          set +e
          BRANCH="${GITHUB_REF_NAME}"
          git config user.name  "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          cp data/signals.json "$RUNNER_TEMP/signals.json"
          [ -f data/source_cache.json ] && cp data/source_cache.json "$RUNNER_TEMP/source_cache.json"   # article cache written by enrich_signals.py

          for attempt in 1 2 3; do
            git fetch origin "$BRANCH" || { echo "::error::Could not fetch branch '$BRANCH'."; exit 1; }
            git reset --hard "origin/$BRANCH"          # take the latest repo state (no merge conflicts)
            mkdir -p data
            cp "$RUNNER_TEMP/signals.json" data/signals.json
            git add data/signals.json
            if [ -f "$RUNNER_TEMP/source_cache.json" ]; then
              cp "$RUNNER_TEMP/source_cache.json" data/source_cache.json
              git add data/source_cache.json
            fi
            if git diff --cached --quiet; then
              echo "No new items - nothing to commit."
              exit 0
            fi
            git commit -q -m "Live feed update $(date -u +'%Y-%m-%d %H:%M UTC')"
            OUT=$(git push origin "HEAD:$BRANCH" 2>&1); RC=$?
            echo "$OUT"
            if [ $RC -eq 0 ]; then echo "Feed saved."; exit 0; fi
            if echo "$OUT" | grep -qiE "403|permission|denied"; then
              echo "::error::Push blocked. Go to Settings > Actions > General > Workflow permissions, choose 'Read and write permissions', Save, then re-run."
              exit 1
            fi
            if echo "$OUT" | grep -qiE "protected branch|GH006|rule"; then
              echo "::error::Branch '$BRANCH' is protected. Allow github-actions to push, or remove the branch rule in Settings > Branches / Rules."
              exit 1
            fi
            echo "Push attempt $attempt failed - retrying in 10 s..."; sleep 10
          done
          echo "::error::Push failed after 3 attempts. See the log lines above."
          exit 1
